[project]
name = "mojo-kmodes"
version = "0.1.0"
description = "Mojo-accelerated k-modes and k-prototypes clustering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "kmodes", "clustering", "machine-learning", "performance"]
dependencies = ["numpy", "scipy", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest", "kmodes==0.12.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
